/* ============================================================
   IHHN iCCM Malaria Surveillance Dashboard — vanilla JS, no deps.
   Every rendered figure derives from DATA (inlined above) or from
   exact integer counts within it. No forecasts, no targets, no YoY.
   ============================================================ */
(function(){
"use strict";

/* ---------- 1. formatting (bind once, use everywhere) ---------- */
var N  = function(v){ return Number(v).toLocaleString("en-US"); };
var P1 = function(v){ return (Math.round(v*10)/10).toFixed(1) + "%"; };
var P2 = function(v){ return (Math.round(v*100)/100).toFixed(2) + "%"; };
var DY = function(v){ return (Math.round(v*10)/10).toFixed(1) + " days"; };
var PP = function(v){ return (v>=0?"+":"") + (Math.round(v*10)/10).toFixed(1) + " pp"; };
var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
var rate = function(num,den){ return P1(num/den*100) + " (" + N(num) + " / " + N(den) + ")"; };

/* ---------- 2. colour scales ---------- */
/* §2.3 sequential — fixed transmission bands, NOT min-max normalised */
function seq(v){
  if(v < 3)    return ["#EAF3F3","#1A1D21","0.0-2.9%"];
  if(v < 6)    return ["#C9E3E1","#1A1D21","3.0-5.9%"];
  if(v <= 9.0) return ["#9BCFCC","#12324B","6.0-9.0%"];
  if(v < 15)   return ["#2E7D7A","#FFFFFF","9.1-14.9%"];
  if(v < 25)   return ["#14595A","#FFFFFF","15.0-24.9%"];
  return ["#E4572E","#1A1D21","25%+"];
}
/* inverted sequential for coverage/completeness: low value = dark */
function seqInv(v){
  var d = 100 - v;
  if(d < 1)  return ["#EAF3F3","#1A1D21"];
  if(d < 2)  return ["#C9E3E1","#1A1D21"];
  if(d < 5)  return ["#9BCFCC","#12324B"];
  if(d < 10) return ["#2E7D7A","#FFFFFF"];
  if(d < 20) return ["#14595A","#FFFFFF"];
  return ["#E4572E","#1A1D21"];
}
/* §2.4 diverging — dev = value - midpoint, already sign-flipped by caller
   where high is good (teal must always mean "better") */
function div(dev){
  if(dev <= -6) return ["#1F7A78","#FFFFFF"];
  if(dev <= -3) return ["#7FBFBC","#12324B"];
  if(dev <= -1) return ["#D6EAE8","#1A1D21"];
  if(dev <   1) return ["#F1F1EF","#1A1D21"];
  if(dev <   3) return ["#F8D3C6","#1A1D21"];
  if(dev <   6) return ["#EF9877","#12324B"];
  return ["#C7431B","#FFFFFF"];
}
var C = { pv:"#0F6E6E", pf:"#12324B", mixed:"#6E9C55", neg:"#C2C9CE",
          male:"#12324B", female:"#3E8F8C", al:"#0F6E6E", cq:"#7FBFBC",
          pq:"#14595A", nodrug:"#E4572E", teal:"#0F6E6E", navy:"#12324B",
          coral:"#E4572E", grid:"#E8EBED" };

/* ---------- 3. cell builders ---------- */
function heatSeq(v, label, aria){
  if(v===null||v===undefined) return nullCell();
  var s = seq(v);
  return '<td class="heat" title="'+esc(label||"")+'" aria-label="'+esc(aria||"")+'">'+
         '<span style="background:'+s[0]+';color:'+s[1]+'">'+P1(v)+'</span></td>';
}
function heatDiv(v, dev, txt, label, aria){
  if(v===null||v===undefined) return nullCell();
  var s = div(dev);
  return '<td class="heat" title="'+esc(label||"")+'" aria-label="'+esc(aria||"")+'">'+
         '<span style="background:'+s[0]+';color:'+s[1]+'">'+txt+'</span></td>';
}
function nullCell(){ return '<td class="cell--null" aria-label="Not recorded">&mdash;</td>'; }
function barCell(v, max, title){
  var pct = max>0 ? (v/max*100) : 0;
  return '<td class="num bar-cell" style="--pct:'+pct.toFixed(1)+'" title="'+esc(title||"")+'">'+
         '<span>'+N(v)+'</span></td>';
}
function vat(id, title, headers, rows){ /* "View as table" disclosure */
  var h = '<details class="view-as-table"><summary>View as table &mdash; '+esc(title)+'</summary>'+
          '<table><caption>'+esc(title)+'</caption><thead><tr>';
  headers.forEach(function(x,i){ h += '<th'+(i?' class="num" scope="col"':' scope="col"')+'>'+x+'</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr>';
    r.forEach(function(c,i){ h += '<td'+(i?' class="num"':'')+'>'+c+'</td>'; });
    h += '</tr>';
  });
  return h + '</tbody></table></details>';
}
function card(opts){
  return '<section class="card '+(opts.cls||"")+'">'+
    (opts.eyebrow ? '<p class="card__eyebrow">'+opts.eyebrow+'</p>' : '')+
    '<div class="titlerow"><h2 class="card__title">'+opts.title+'</h2>'+
      (opts.info ? '<button type="button" class="info" aria-label="'+esc(opts.info)+'" title="'+esc(opts.info)+'">i</button>' : '')+
    '</div>'+
    (opts.sub ? '<p class="card__sub">'+opts.sub+'</p>' : '')+
    '<div class="card__body">'+opts.body+'</div>'+
    (opts.foot ? '<p class="card__foot">'+opts.foot+'</p>' : '')+
  '</section>';
}
function kpi(o){
  return '<section class="card kpi '+(o.cls||"")+'">'+
    '<p class="card__eyebrow">'+o.eyebrow+'</p>'+
    '<p class="kpi-value">'+o.value+'</p>'+
    '<p class="kpi-sub">'+o.sub+'</p></section>';
}

/* ---------- 4. derived reference structures (mappings only) ---------- */
var UC2TEHSIL = {};   /* union council -> tehsil, 1:1 in source */
DATA.chw.forEach(function(c){ UC2TEHSIL[c.uc] = c.tehsil; });
var MONTH_LABEL = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"];
var TOT = DATA.kpi;

/* ============================================================
   PAGE 1 — EXECUTIVE SURVEILLANCE
   ============================================================ */
function comboChart(){
  var W=820,H=330,ml=56,mr=58,mt=22,mb=52;
  var pw=W-ml-mr, ph=H-mt-mb;
  var m=DATA.monthly, yMax=2600, y2Max=20;
  var band=pw/m.length, bw=band*0.6;
  var y  = function(v){ return mt+ph-(v/yMax)*ph; };
  var y2 = function(v){ return mt+ph-(v/y2Max)*ph; };
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" width="'+W+'" height="'+H+'" '+
        'aria-label="Monthly RDTs performed and test positivity rate, January to August 2026. '+
        'Testing volume peaks at 2,516 in May and falls to 1,355 in August while positivity rises from 2.6 percent in February to 18.9 percent in July.">';
  /* gridlines + left axis */
  for(var g=0; g<=yMax; g+=500){
    s+='<line x1="'+ml+'" x2="'+(ml+pw)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="'+C.grid+'"/>';
    s+='<text class="svg-num" x="'+(ml-8)+'" y="'+(y(g)+4)+'" text-anchor="end" fill="#12324B">'+N(g)+'</text>';
  }
  /* right axis */
  for(var r=0; r<=y2Max; r+=5){
    s+='<text class="svg-num" x="'+(ml+pw+8)+'" y="'+(y2(r)+4)+'" fill="#B03A18">'+r+'%</text>';
  }
  s+='<text class="svg-label" x="'+ml+'" y="12" fill="#12324B">RDTs performed (count)</text>';
  s+='<text class="svg-label" x="'+(ml+pw)+'" y="12" text-anchor="end" fill="#B03A18">Test positivity (%)</text>';
  /* bars */
  m.forEach(function(d,i){
    var x=ml+band*i+(band-bw)/2, un=d.encounters-d.tested;
    s+='<rect x="'+x+'" y="'+y(d.tested)+'" width="'+bw+'" height="'+(y(0)-y(d.tested))+'" fill="#9BCFCC"><title>'+
       MONTH_LABEL[i]+' 2026 — tested '+N(d.tested)+' of '+N(d.encounters)+' encounters</title></rect>';
    if(un>0){
      s+='<rect x="'+x+'" y="'+y(d.encounters)+'" width="'+bw+'" height="'+(y(d.tested)-y(d.encounters))+'" fill="#C2C9CE"><title>'+
         MONTH_LABEL[i]+' — not tested '+N(un)+'</title></rect>';
    }
    s+='<text class="svg-label" x="'+(x+bw/2)+'" y="'+(mt+ph+18)+'" text-anchor="middle" fill="#1A1D21">'+MONTH_LABEL[i]+'</text>';
  });
  s+='<text class="svg-label" x="'+(ml+band*0+band/2)+'" y="'+(mt+ph+32)+'" text-anchor="middle">2026</text>';
  /* May/Jun inflection rule */
  var xr=ml+band*5;
  s+='<line x1="'+xr+'" x2="'+xr+'" y1="'+mt+'" y2="'+(mt+ph)+'" stroke="#C2C9CE" stroke-dasharray="4 3"/>';
  /* TPR line */
  var pts=m.map(function(d,i){ return (ml+band*i+band/2)+","+y2(d.tpr); }).join(" ");
  s+='<polyline points="'+pts+'" fill="none" stroke="'+C.coral+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  m.forEach(function(d,i){
    s+='<circle cx="'+(ml+band*i+band/2)+'" cy="'+y2(d.tpr)+'" r="4" fill="'+C.coral+'"><title>'+
       MONTH_LABEL[i]+' — TPR '+P1(d.tpr)+' ('+N(d.pos)+' / '+N(d.tested)+')</title></circle>';
  });
  /* direct labels */
  s+='<text class="svg-num" x="'+(ml+band*6+band/2)+'" y="'+(y2(m[6].tpr)-12)+'" text-anchor="middle" '+
     'fill="#B03A18" font-weight="600" font-size="13">'+P1(m[6].tpr)+'</text>';
  s+='<text class="svg-num" x="'+(ml+band*4+band/2)+'" y="'+(y(m[4].tested)-6)+'" text-anchor="middle" fill="#12324B" font-weight="600">'+N(m[4].tested)+'</text>';
  s+='</svg>';

  var rows = m.map(function(d,i){
    return [MONTH_LABEL[i]+" 2026", N(d.encounters), N(d.tested), N(d.encounters-d.tested), N(d.pos), P1(d.tpr)];
  });
  rows.push(["<strong>Total</strong>", N(TOT.encounters), N(TOT.tested), N(TOT.untested), N(TOT.positives), P1(TOT.tpr)]);

  return card({
    cls:"c8", eyebrow:"Row 2 &middot; Case-finding effort vs transmission",
    title:"Monthly testing volume and test positivity",
    sub:"Bars: RDTs performed (left axis). Line: test positivity, "+P1(TOT.tpr)+" programme mean ("+N(TOT.positives)+" / "+N(TOT.tested)+"). Right axis 0&ndash;20%.",
    body:'<figure>'+s+
      '<div class="legend">'+
        '<span class="li"><span class="sw" style="background:#9BCFCC"></span>RDTs performed</span>'+
        '<span class="li"><span class="sw" style="background:#C2C9CE"></span>Not tested (Mar 1, Jun 1, Jul 27, Aug 34)</span>'+
        '<span class="li"><span class="sw" style="background:#E4572E"></span>Test positivity %</span>'+
        '<span class="li"><span class="sw" style="background:transparent;border:0;border-left:1px dashed #C2C9CE"></span>May/Jun inflection</span>'+
      '</div>'+
      '<p class="callout">Testing volume falls after May (2,516 &rarr; 1,355) while positivity rises to 18.9% in July. Case-finding effort is declining as transmission peaks.</p>'+
      '</figure>'+
      vat("p1combo","Monthly volume and positivity",
          ["Month","Encounters","Tested","Not tested","Positives","TPR"], rows),
    foot:"Source: events.csv, "+N(TOT.encounters)+" encounters, Jan&ndash;Aug 2026. Dual axis is used because the divergence between the two series is the finding; each axis carries its unit and its series colour."
  });
}

function donutChart(){
  var sp=DATA.species, tot=TOT.positives;
  var R=74.5, SW=31, CIRC=2*Math.PI*R, cx=110, cy=110;
  var cols=[C.pv,C.pf,C.mixed];
  var s='<svg viewBox="0 0 320 250" width="320" height="250" role="img" aria-label="Species split of '+N(tot)+
        ' positive cases: P. vivax '+N(sp[0].v)+', P. falciparum '+N(sp[1].v)+', Mixed '+N(sp[2].v)+'.">';
  var acc=0;
  sp.forEach(function(d,i){
    var frac=d.v/tot, len=CIRC*frac;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+cols[i]+'" stroke-width="'+SW+'" '+
       'stroke-dasharray="'+Math.max(len-2,0.5).toFixed(2)+' '+(CIRC-Math.max(len-2,0.5)).toFixed(2)+'" '+
       'stroke-dashoffset="'+(-CIRC*acc).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')">'+
       '<title>'+esc(d.k)+' — '+N(d.v)+' of '+N(tot)+' positives ('+P1(d.v/tot*100)+')</title></circle>';
    acc+=frac;
  });
  s+='<text class="svg-num" x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-size="40" font-weight="600" fill="#12324B">'+N(tot)+'</text>';
  s+='<text class="svg-label" x="'+cx+'" y="'+(cy+26)+'" text-anchor="middle" letter-spacing="1">POSITIVES</text>';
  /* Mixed = 1.1% ~ 4deg: leader line to an outside label */
  var midAng=(sp[0].v+sp[1].v+sp[2].v/2)/tot*2*Math.PI - Math.PI/2;
  var lx=cx+Math.cos(midAng)*(R+18), ly=cy+Math.sin(midAng)*(R+18);
  s+='<line x1="'+(cx+Math.cos(midAng)*(R+SW/2))+'" y1="'+(cy+Math.sin(midAng)*(R+SW/2))+'" x2="'+lx+'" y2="'+ly+'" stroke="#5A6472"/>';
  s+='<line x1="'+lx+'" y1="'+ly+'" x2="'+(lx-46)+'" y2="'+ly+'" stroke="#5A6472"/>';
  s+='<text class="svg-num" x="'+(lx-50)+'" y="'+(ly+4)+'" text-anchor="end" fill="#1A1D21">Mixed 13 (1.1%)</text>';
  s+='</svg>';

  var legend='<table class="legend-rows"><caption class="vsr">Species split of positives</caption><tbody>';
  sp.forEach(function(d,i){
    legend+='<tr><td><span class="legend"><span class="li"><span class="sw" style="background:'+cols[i]+'"></span>'+
      esc(d.k)+'</span></span></td><td class="num">'+N(d.v)+'</td><td class="num">'+P1(d.v/tot*100)+'</td></tr>';
  });
  legend+='<tr><td><strong>All positives</strong></td><td class="num">'+N(tot)+'</td><td class="num">100.0%</td></tr></tbody></table>';

  return card({
    cls:"c4", eyebrow:"Row 2b &middot; Species", title:"Species split of positives",
    sub:N(tot)+" positives of "+N(TOT.tested)+" tested &middot; "+P1(TOT.tpr)+" test positivity",
    body:'<figure>'+s+legend+'</figure>'+
      vat("p1donut","Species split",["Species","Count","% of positives"],
        sp.map(function(d){ return [esc(d.k), N(d.v), P1(d.v/tot*100)]; })
          .concat([["<strong>Total</strong>", N(tot), "100.0%"]])),
    foot:"Species colour is category, not severity: P. falciparum is navy, never coral."
  });
}

/* --- P1 matrix: Tehsil -> UC, plus a district-wide facility group --- */
var matrixOpen = { "T:Zhob":true, "T:Kaker Khurasan":true, "G:FAC":false };
function matrixRows(){
  var out=[], maxN=0, maxP=0;
  DATA.byTehsil.forEach(function(t){ maxN=Math.max(maxN,t.n); maxP=Math.max(maxP,t.p); });
  function row(o, lvl, key, expandable){
    var open = expandable ? !!matrixOpen[key] : false;
    var dev1 = o.tpr - 9.1;                 /* TPR: high is bad, normal polarity */
    var dev2 = -(o.pqRate - 44.0);          /* referral: high is good -> flip */
    var dev3 = o.avgLag - 34.7;             /* lag: long is bad */
    var name = expandable
      ? '<button type="button" class="twisty" aria-expanded="'+open+'" data-mkey="'+esc(key)+'" '+
        'aria-label="'+(open?"Collapse ":"Expand ")+esc(o.name)+'">'+(open?"&minus;":"+")+'</button>'+esc(o.name)
      : esc(o.name);
    var h='<tr class="lvl'+lvl+'"><td>'+name+'</td>'+
      barCell(o.n, maxN, "Encounters "+N(o.n)+" of "+N(TOT.encounters)+" programme total")+
      '<td class="num">'+N(o.t)+'</td>'+
      barCell(o.p, maxP, "Positives "+N(o.p)+" of "+N(o.t)+" tested")+
      heatSeq(o.tpr, "TPR "+P1(o.tpr)+" = "+N(o.p)+" / "+N(o.t)+" tested",
              o.name+", test positivity "+P1(o.tpr)+", "+(o.tpr>9.1?"above":"at or below")+" programme average of 9.1 percent")+
      heatDiv(o.pqRate, dev2, P1(o.pqRate),
              "Pv primaquine referral "+P1(o.pqRate)+" = "+N(o.pq)+" / "+N(o.pv)+" P. vivax positives &middot; programme average 44.0%",
              o.name+", primaquine referral "+P1(o.pqRate)+", "+PP(o.pqRate-44.0)+" versus programme average 44.0 percent")+
      heatDiv(o.avgLag, dev3, (Math.round(o.avgLag*10)/10).toFixed(1),
              "Mean reporting lag "+DY(o.avgLag)+" over "+N(o.lagN)+" encounters with a usable lag &middot; programme clean mean 34.7 days",
              o.name+", average reporting lag "+DY(o.avgLag)+", programme average 34.7 days")+
      '</tr>';
    return h;
  }
  DATA.byTehsil.forEach(function(t){
    out.push(row(t,1,"T:"+t.name,true));
    if(matrixOpen["T:"+t.name]){
      DATA.byUC.filter(function(u){ return UC2TEHSIL[u.name]===t.name; })
        .sort(function(a,b){ return b.n-a.n; })
        .forEach(function(u){ out.push(row(u,2,"U:"+u.name,false)); });
    }
  });
  var gopen = !!matrixOpen["G:FAC"];
  out.push('<tr class="lvl1"><td colspan="7" style="background:var(--card-alt)">'+
    '<button type="button" class="twisty" aria-expanded="'+gopen+'" data-mkey="G:FAC" '+
    'aria-label="'+(gopen?"Collapse":"Expand")+' facility breakdown">'+(gopen?"&minus;":"+")+'</button>'+
    '<span class="card__eyebrow">Facility level &mdash; 13 facilities, district-wide</span> '+
    '<span class="tiny">Facilities serve several union councils, so they are listed as a flat level rather than nested.</span></td></tr>');
  if(gopen){
    var fmaxN=0,fmaxP=0;
    DATA.byFacility.forEach(function(f){ fmaxN=Math.max(fmaxN,f.n); fmaxP=Math.max(fmaxP,f.p); });
    DATA.byFacility.slice().sort(function(a,b){ return b.n-a.n; }).forEach(function(f){
      var dev2=-(f.pqRate-44.0), dev3=f.avgLag-34.7;
      out.push('<tr class="lvl3"><td>'+esc(f.name)+'</td>'+
        barCell(f.n,fmaxN,"Encounters "+N(f.n))+
        '<td class="num">'+N(f.t)+'</td>'+
        barCell(f.p,fmaxP,"Positives "+N(f.p)+" of "+N(f.t)+" tested")+
        heatSeq(f.tpr,"TPR "+P1(f.tpr)+" = "+N(f.p)+" / "+N(f.t)+" tested",
                f.name+", test positivity "+P1(f.tpr))+
        heatDiv(f.pqRate,dev2,P1(f.pqRate),"Referral "+P1(f.pqRate)+" = "+N(f.pq)+" / "+N(f.pv)+" P. vivax",
                f.name+", primaquine referral "+P1(f.pqRate))+
        heatDiv(f.avgLag,dev3,(Math.round(f.avgLag*10)/10).toFixed(1),
                "Mean lag "+DY(f.avgLag)+" over "+N(f.lagN)+" encounters", f.name+", average lag "+DY(f.avgLag))+
        '</tr>');
    });
  }
  return out.join("");
}

    info:"Sequential fill = test positivity on fixed transmission bands. Diverging fills state their midpoint in the legend. Every cell carries its number as text.",
    body:'<div class="scroller" role="region" tabindex="0" aria-label="Positivity matrix, scrollable">'+
      '<table id="matrix"><caption class="vsr">Encounters, tests, positives, positivity, primaquine referral and reporting lag by tehsil, union council and facility</caption>'+
      head+'<tbody>'+totals+matrixRows()+'</tbody></table></div>'+

        '<span class="li"><span class="sw" style="background:#2E7D7A"></span>9.1&ndash;14.9%</span>'+
        '<span class="li"><span class="sw" style="background:#14595A"></span>15&ndash;24.9%</span>'+

      vat("p1matrix","Positivity matrix, all levels",
          ["Area","Encounters","Tested","Positives","TPR","Pv referral","Avg lag"], vrows),
    foot:"Data bars scale to the largest value among the visible rows of the same level; the numeral is always present. Click a tehsil or union council row to filter the row-level tables on pages 2 and 4."
  });

function wireMatrix(){
  var t=document.getElementById("matrix");
  if(!t) return;
  t.addEventListener("click", function(e){
    var b=e.target.closest("button[data-mkey]");
    if(b){ var k=b.getAttribute("data-mkey"); matrixOpen[k]=!matrixOpen[k]; renderP1(); return; }
    var tr=e.target.closest("tr.lvl1,tr.lvl2");
    if(tr && !tr.classList.contains("totals")){
      var label=tr.querySelector("td").textContent.replace(/^[-+−]\s*/,"").trim();
      if(label) setFilter(tr.classList.contains("lvl1") ? "tehsil" : "uc", label);
    }
  });
}

var SPECIES_ORDER = ["Plasmodium vivax","Plasmodium falciparum","Mixed","Negative"];
var SPECIES_SHORT = {"Plasmodium vivax":"P. vivax","Plasmodium falciparum":"P. falciparum","Mixed":"Mixed","Negative":"Negative / no result"};

function stacked100(){
  var W=660, rowH=36, gap=12, labelW=190, barW=W-labelW-8;
  var H=SPECIES_ORDER.length*(rowH+gap);
  var s='<svg viewBox="0 0 '+W+' '+(H+8)+'" width="'+W+'" height="'+(H+8)+'" role="img" '+
    'aria-label="Drug administered by species diagnosed, as mutually exclusive shares of each species group. P. vivax n=989: AL only 909, AL plus chloroquine 8, chloroquine only 5, no drug recorded 67. P. falciparum n=174: AL only 161, no drug 13. Mixed n=13: AL only 8, no drug 5. Negative n=11,760: AL only 1, no drug 11,759.">'+
    '<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
    '<rect width="6" height="6" fill="#12324B"/><rect width="2" height="6" fill="#FFFFFF" opacity="0.2"/></pattern></defs>';
  SPECIES_ORDER.forEach(function(k,i){
    var d=DATA.treatExclusive[k], y=i*(rowH+gap);
    var segs=[{n:"AL only",v:d.alOnly,c:(k==="Plasmodium falciparum"?"url(#hatch)":C.al),tc:"#FFFFFF"},
              {n:"AL + chloroquine",v:d.both,c:"#14595A",tc:"#FFFFFF"},
              {n:"Chloroquine only",v:d.cqOnly,c:C.cq,tc:"#12324B"},
              {n:"No drug recorded",v:d.none,c:C.nodrug,tc:"#1A1D21"}];
    s+='<text class="svg-label" x="0" y="'+(y+16)+'" fill="#1A1D21" font-size="13" font-weight="600">'+esc(SPECIES_SHORT[k])+'</text>';
    s+='<text class="svg-num" x="0" y="'+(y+32)+'" fill="#5A6472">n = '+N(d.n)+'</text>';
    var x=labelW;
    segs.forEach(function(g){
      if(g.v<=0) return;
      var w=g.v/d.n*barW;
      s+='<rect x="'+x.toFixed(2)+'" y="'+y+'" width="'+w.toFixed(2)+'" height="'+rowH+'" fill="'+g.c+'">'+
         '<title>'+esc(SPECIES_SHORT[k])+' — '+g.n+': '+N(g.v)+' of '+N(d.n)+' ('+P2(g.v/d.n*100)+')</title></rect>';
      if(w/barW >= 0.08){
        s+='<text class="svg-num" x="'+(x+w/2).toFixed(2)+'" y="'+(y+rowH/2+4)+'" text-anchor="middle" fill="'+g.tc+'" font-weight="600">'+
           P1(g.v/d.n*100)+'</text>';
      }else{
        var lx=x+w/2;
        s+='<line x1="'+lx.toFixed(2)+'" y1="'+(y-2)+'" x2="'+lx.toFixed(2)+'" y2="'+(y-9)+'" stroke="#5A6472"/>'+
           '<text class="svg-num" x="'+lx.toFixed(2)+'" y="'+(y-12)+'" text-anchor="middle" fill="#1A1D21">'+
           (g.v/d.n*100 < 0.05 ? P2(g.v/d.n*100) : P1(g.v/d.n*100))+' ('+N(g.v)+')</text>';
      }
      x+=w;
    });
    if(d.n<30){
      s+='<text class="svg-num" x="'+(labelW-8)+'" y="'+(y+32)+'" text-anchor="end" fill="#A35A05">small n</text>';
    }
  });
  s+='</svg>';
  var rows=SPECIES_ORDER.map(function(k){
    var d=DATA.treat[k], e=DATA.treatExclusive[k];
    return [esc(SPECIES_SHORT[k]), N(e.n), N(e.alOnly)+" ("+P1(e.alOnly/e.n*100)+")", N(e.both)+" ("+P2(e.both/e.n*100)+")",
            N(e.cqOnly)+" ("+P2(e.cqOnly/e.n*100)+")", N(e.none)+" ("+P1(e.none/e.n*100)+")", N(d.PQ)];
  });
  return card({
    cls:"c7", eyebrow:"Row 2 &middot; Protocol",
    title:"Species diagnosed vs drug administered",
    sub:"Each bar is 100% of its own species group; n is printed because 100% bars destroy magnitude.",
    body:'<figure>'+s+
      '<div class="legend">'+
        '<span class="li"><span class="sw" style="background:'+C.al+'"></span>AL only (P. vivax solid)</span>'+
        '<span class="li"><span class="sw" style="background:'+C.pf+';background-image:linear-gradient(45deg,rgba(255,255,255,.35) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.35) 75%,transparent 75%);background-size:6px 6px"></span>AL only (P. falciparum, hatched)</span>'+
        '<span class="li"><span class="sw" style="background:#14595A"></span>AL + chloroquine (both)</span>'+'<span class="li"><span class="sw" style="background:'+C.cq+'"></span>Chloroquine only</span>'+
        '<span class="li"><span class="sw" style="background:'+C.nodrug+'"></span>No drug recorded</span>'+
      '</div>'+
      '<p class="tiny" style="margin-top:8px">Mixed <span class="chip chip--smalln">n = 13 (rate threshold 30)</span> &mdash; percentages shown for completeness only.</p>'+
      '</figure>'+
      vat("p2stack","Drug administered by species",
        ["Species","n","AL only","AL + chloroquine","Chloroquine only","No drug recorded","Primaquine referral (adjunct)"], rows),
    foot:"Segments are mutually exclusive and sum to exactly 100% of each species group. 8 P. vivax patients received both AL and chloroquine and are counted once, in their own segment. Primaquine referral is an adjunct to AL, not an alternative, so it is not a segment &mdash; stacking it would break the sum to 100%. "+
      "<br><br>Pf&rarr;AL is 161, not 162. The 162nd record has the drug name typed into the quantity field (80480) and is routed to the exception grid. "+
      "No P. falciparum patient received chloroquine (0 of 174); all 13 chloroquine records are P. vivax. The signal is the inverse: 917 of 989 vivax cases were treated with AL and 13 with chloroquine."
  });
}

  });

function pyramid(){
  var bands=["<5","5-14","15-49","50+"], unk="Unknown";
  var W=620, cw=120, rowH=42, gap=10, axisMax=5400;
  var side=(W-cw)/2-10;
  var order=[unk].concat(bands.slice().reverse());   /* Unknown drawn last/top, separated */
  var H=order.length*(rowH+gap)+42;
  var cx=W/2;
  var scale=function(v){ return v/axisMax*side; };
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="Age and sex distribution of encounters. Male left, female right. Under 5: 1,191 male, 929 female. 5 to 14: 1,829 male, 2,053 female. 15 to 49: 1,373 male, 5,209 female. 50 plus: 71 male, 218 female. Age unknown: 31 male, 92 female.">'+
    '<defs><pattern id="unkhatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
    '<rect width="6" height="6" fill="#C2C9CE"/><rect width="2" height="6" fill="#FFFFFF"/></pattern></defs>';
  s+='<text class="svg-label" x="'+(cx-cw/2-8)+'" y="12" text-anchor="end" fill="#12324B" font-weight="600">Male</text>';
  s+='<text class="svg-label" x="'+(cx+cw/2+8)+'" y="12" fill="#3E8F8C" font-weight="600">Female</text>';
  order.forEach(function(b,i){
    var y=22+i*(rowH+gap), d=DATA.pyramid[b];
    var isUnk = b===unk;
    if(isUnk){
      s+='<line x1="0" x2="'+W+'" y1="'+(y+rowH+gap/2)+'" y2="'+(y+rowH+gap/2)+'" stroke="#C2C9CE"/>';
    }
    var mw=scale(d.Male), fw=scale(d.Female);
    s+='<rect x="'+(cx-cw/2-mw).toFixed(1)+'" y="'+y+'" width="'+mw.toFixed(1)+'" height="'+rowH+'" fill="'+(isUnk?"url(#unkhatch)":C.male)+'">'+
       '<title>'+esc(b)+', male: '+N(d.Male)+' encounters</title></rect>';
    s+='<rect x="'+(cx+cw/2)+'" y="'+y+'" width="'+fw.toFixed(1)+'" height="'+rowH+'" fill="'+(isUnk?"url(#unkhatch)":C.female)+'">'+
       '<title>'+esc(b)+', female: '+N(d.Female)+' encounters</title></rect>';
    s+='<text class="svg-num" x="'+(cx-cw/2-mw-6).toFixed(1)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" fill="#1A1D21">'+N(d.Male)+'</text>';
    s+='<text class="svg-num" x="'+(cx+cw/2+fw+6).toFixed(1)+'" y="'+(y+rowH/2+4)+'" fill="#1A1D21">'+N(d.Female)+'</text>';
    s+='<text class="svg-label" x="'+cx+'" y="'+(y+rowH/2+4)+'" text-anchor="middle" fill="#1A1D21" font-size="12" font-weight="600">'+
       (isUnk?"Unknown age":esc(b))+'</text>';
  });
  s+='</svg>';
  var rows=bands.concat([unk]).map(function(b){
    var d=DATA.pyramid[b];
    return [b, N(d.Male), N(d.Female), N(d.Male+d.Female)];
  });
  rows.push(["<strong>All bands</strong>", N(DATA.gender.Male), N(DATA.gender.Female), N(DATA.gender.Male+DATA.gender.Female)]);
  return card({
    cls:"c6", eyebrow:"Row 1 &middot; Who is being reached",
    title:"Age and sex distribution of encounters",
    sub:"Symmetric axis to 5,400 encounters per side. Age derived from date of birth against event date.",
    body:'<figure>'+s+
      '<p class="callout">15&ndash;49 female (5,209) is 40% of all encounters &mdash; a service-access pattern (female CHW outreach), not necessarily an epidemiological one.</p></figure>'+
      vat("p3pyr","Age and sex distribution",["Age band","Male","Female","Total"],rows),
    foot:"3 records recorded as transgender are not shown in the pyramid; included in all totals. "+
      "Unknown age (123 records, 0.9% of encounters) is hatched and placed above a rule so it cannot be read as an age group."
  });
}

var p4 = { view:"facility", q:"", minN:50, page:0, showAll:false,
           sortKey:"n", sortDir:-1 };
var PAGE_SIZE=25;

function chwScoreNote(){
  return "Adherence score (composite, 0&ndash;100) = equal-weight mean of three components computed upstream: "+
    "P. falciparum AL adherence, P. vivax primaquine referral rate, and 1 &minus; (positives with no drug recorded / positives). "+
    "Components default to 1, 0 and 1 respectively where the denominator is zero. This is a constructed index, not a measured value, "+
    "and it is deliberately absent from page 1.";
}

function p4Rows(){
  var f=filterState;
  if(p4.view==="facility"){
    var rows=DATA.byFacility.slice();
    if(p4.q) rows=rows.filter(function(r){ return r.name.toLowerCase().indexOf(p4.q)>=0; });
    return {rows:rows, below:[], total:DATA.byFacility.length};
  }
  var all=DATA.chw.slice();
  if(f.kind==="tehsil") all=all.filter(function(c){ return c.tehsil===f.value; });
  if(f.kind==="uc")     all=all.filter(function(c){ return c.uc===f.value; });
  if(p4.q) all=all.filter(function(c){ return c.name.toLowerCase().indexOf(p4.q)>=0; });
  var above=all.filter(function(c){ return c.n>=p4.minN; });
  var below=all.filter(function(c){ return c.n< p4.minN; });
  return {rows:above, below:below, total:all.length};
}

function sortRows(rows){
  var k=p4.sortKey, d=p4.sortDir;
  return rows.slice().sort(function(a,b){
    var x=a[k], y=b[k];
    if(typeof x==="string") return d*x.localeCompare(y);
    if(x===undefined||x===null) x=-Infinity;
    if(y===undefined||y===null) y=-Infinity;
    return d*(x-y);
  });
}

function scorecard(){
  var isFac=p4.view==="facility";
  var got=p4Rows(), rows=sortRows(got.rows);
  var maxN=0; rows.forEach(function(r){ maxN=Math.max(maxN,r.n); });
  var pageRows = (isFac||p4.showAll) ? rows : rows.slice(p4.page*PAGE_SIZE,(p4.page+1)*PAGE_SIZE);
  var cols = isFac
    ? [["rank","Rank",0],["name","Facility",0],["n","Encounters",1],["cov","Test coverage",1],
       ["p","Positives",1],["tpr","TPR",1],["pqRate","Pv referral",1],["avgLag","Avg lag",1]]
    : [["rank","Rank",0],["name","CHW",0],["n","Encounters",1],["completeness","Completeness",1],
       ["pos","Positives",1],["tpr","TPR",1],["pqRate","Pv referral",1],["avgLag","Avg lag",1],["score","Adherence score",1]];
  var head='<thead><tr>'+cols.map(function(c){
    var sortable = c[0]!=="rank" && c[0]!=="cov";
    var aria = (p4.sortKey===c[0]) ? (p4.sortDir===-1?"descending":"ascending") : "none";
    var arrow = (p4.sortKey===c[0]) ? (p4.sortDir===-1?" &#9660;":" &#9650;") : "";
    var title = ({n:"Total encounters recorded",cov:"RDTs performed / encounters",
      completeness:"Share of encounters with event status COMPLETED",
      tpr:"Positives / tested. Sequential scale on fixed transmission bands.",
      pqRate:"Primaquine referrals / P. vivax positives. Diverging scale, midpoint 44.0%, teal = better.",
      avgLag:"Mean reporting lag, days. Diverging scale, midpoint 34.7 days.",
      score:"Composite index, midpoint 50. Definition in the card footnote."})[c[0]]||"";
    return '<th scope="col" class="'+(c[2]?"num":"")+'" '+(sortable?'aria-sort="'+aria+'"':'')+' title="'+esc(title)+'">'+
      (sortable?'<button type="button" class="sortbtn" data-sort="'+c[0]+'">'+c[1]+arrow+'</button>':c[1])+'</th>';
  }).join("")+'</tr></thead>';

  var body="";
  if(!pageRows.length){
    body='<tr><td colspan="'+cols.length+'"><div class="insufficient"><p class="eyebrow">No rows match</p>'+
      '<p class="tiny">Adjust the search, the minimum-volume filter or the geography chip.</p></div></td></tr>';
  }
  pageRows.forEach(function(r,i){
    var rank = (isFac||p4.showAll ? i : p4.page*PAGE_SIZE+i)+1;
    var pos = isFac ? r.p : r.pos;
    var mark="", chip="";
    if(p4.sortKey==="score"||p4.sortKey==="tpr"||p4.sortKey==="n"){
      if(rank<=3){ mark="rowmark rowmark--top"; chip='<span class="chip chip--top">Top quartile</span>'; }
      else if(rank>rows.length-3){ mark="rowmark rowmark--bottom"; chip='<span class="chip chip--bottom">Needs support</span>'; }
    }
    var covV = isFac ? (r.t/r.n*100) : r.completeness;
    var covT = isFac ? (N(r.t)+" / "+N(r.n)) : "COMPLETED "+P1(r.completeness);
    var cs=seqInv(covV);
    var pvDen = isFac ? r.pv : r.pv;
    var smalln = (!isFac && pvDen<30);
    var h='<tr class="'+mark+'">'+
      '<td class="num">'+rank+'</td>'+
      '<td>'+esc(r.name)+chip+(isFac?'':'<div class="tiny">'+esc(r.facility)+' &middot; '+esc(r.uc)+'</div>')+'</td>'+
      barCell(r.n,maxN,"Encounters "+N(r.n))+
      '<td class="heat" title="'+esc(covT)+'"><span style="background:'+cs[0]+';color:'+cs[1]+'">'+P1(covV)+'</span></td>'+
      '<td class="num">'+N(pos)+'</td>'+
      heatSeq(r.tpr, "TPR "+P1(r.tpr)+" = "+N(pos)+" / "+(isFac?N(r.t)+" tested":N(r.n)+" encounters"),
              r.name+", test positivity "+P1(r.tpr))+
      (pvDen>0
        ? heatDiv(r.pqRate, -(r.pqRate-44.0), P1(r.pqRate)+(smalln?' <span class="chip chip--smalln">n='+pvDen+'</span>':''),
                  "Referral "+P1(r.pqRate)+" = "+N(r.pq)+" / "+N(pvDen)+" P. vivax positives &middot; midpoint 44.0%",
                  r.name+", primaquine referral "+P1(r.pqRate)+" on "+N(pvDen)+" vivax positives")
        : nullCell())+
      heatDiv(r.avgLag, r.avgLag-34.7, (Math.round(r.avgLag*10)/10).toFixed(1),
              "Mean reporting lag "+DY(r.avgLag)+" &middot; midpoint 34.7 days", r.name+", average lag "+DY(r.avgLag))+
      (isFac ? "" : heatDiv(r.score, (r.score-50)/8.33, (Math.round(r.score*10)/10).toFixed(1),
              "Composite adherence score "+(Math.round(r.score*10)/10).toFixed(1)+" of 100 &middot; midpoint 50",
              r.name+", adherence score "+(Math.round(r.score*10)/10).toFixed(1)+" of 100"))+
      '</tr>';
    body+=h;
  });
  /* below-threshold block */
  if(!isFac && got.below.length){
    body+='<tr><td colspan="'+cols.length+'" style="background:var(--card-alt);font-weight:600">'+
      'Below reporting threshold (n &lt; '+p4.minN+') &mdash; '+N(got.below.length)+' CHWs, excluded from ranking</td></tr>';
    sortRows(got.below).slice(0,p4.showAll?9999:8).forEach(function(r){
      body+='<tr style="color:var(--ink-muted)"><td class="num">&mdash;</td><td>'+esc(r.name)+
        '<span class="chip chip--smalln">n = '+N(r.n)+' (threshold '+p4.minN+')</span>'+
        '<div class="tiny">'+esc(r.facility)+' &middot; '+esc(r.uc)+'</div></td>'+
        '<td class="num">'+N(r.n)+'</td><td class="num">'+P1(r.completeness)+'</td><td class="num">'+N(r.pos)+'</td>'+
        '<td class="num">'+P1(r.tpr)+'</td><td class="num">'+(r.pv>0?P1(r.pqRate):"&mdash;")+'</td>'+
        '<td class="num">'+(Math.round(r.avgLag*10)/10).toFixed(1)+'</td><td class="num">&mdash;</td></tr>';
    });
    if(!p4.showAll && got.below.length>8){
      body+='<tr><td colspan="'+cols.length+'" class="tiny">'+N(got.below.length-8)+' further below-threshold CHWs hidden. Use &ldquo;Show all&rdquo;.</td></tr>';
    }
  }

  var pages=Math.ceil(rows.length/PAGE_SIZE);
  var pager = (isFac||p4.showAll||pages<=1) ? "" :
    '<div class="controls" style="min-height:44px;margin-top:12px">'+
      '<button type="button" class="btn" data-page="prev"'+(p4.page===0?" disabled":"")+'>Previous</button>'+
      '<span class="live">Page '+(p4.page+1)+' of '+pages+'</span>'+
      '<button type="button" class="btn" data-page="next"'+(p4.page>=pages-1?" disabled":"")+'>Next</button>'+
      '<button type="button" class="btn" data-page="all">Show all '+N(rows.length)+' rows</button>'+
    '</div>';

  var vatRows = rows.map(function(r,i){
    return isFac
      ? [String(i+1)+" "+esc(r.name), N(r.n), P1(r.t/r.n*100), N(r.p), P1(r.tpr), P1(r.pqRate), DY(r.avgLag)]
      : [String(i+1)+" "+esc(r.name), N(r.n), P1(r.completeness), N(r.pos), P1(r.tpr), (r.pv>0?P1(r.pqRate):"&mdash;"), DY(r.avgLag), (Math.round(r.score*10)/10).toFixed(1)];
  });

  return card({
    cls:"c12", eyebrow:"Row 2 &middot; League table",
    title:isFac ? "Facility scorecard (13)" : "CHW scorecard (183)",
    sub:(isFac
      ? "13 facilities, un-paginated. Test coverage = RDTs performed / encounters."
      : "Ranked among CHWs with at least "+p4.minN+" encounters. Small-n rows produce nonsense rates and are listed below the ranking, not inside it."),
    info:"Sort any column with the keyboard. Heat cells always carry their number as text.",
    body:'<div class="scroller scroller--tall" role="region" tabindex="0" aria-label="Scorecard table, scrollable">'+
      '<table class="sticky-first" id="scoretbl"><caption class="vsr">'+
      (isFac?"Facility":"Community health worker")+' performance league table</caption>'+head+'<tbody>'+body+'</tbody></table></div>'+pager+
      vat("p4tbl","Scorecard values",
        isFac?["Rank / facility","Encounters","Test coverage","Positives","TPR","Pv referral","Avg lag"]
             :["Rank / CHW","Encounters","Completeness","Positives","TPR","Pv referral","Avg lag","Adherence score"],
        vatRows),
    foot:(isFac
      ? "Facility rows carry no adherence score: the composite is computed per CHW upstream and is not re-derived here."
      : chwScoreNote())+
      " No sparklines or trend arrows: a per-CHW monthly series is not in the payload and would routinely have n&lt;10."
  });
}

function boxStrip(){
  var L=DATA.lag, W=560, H=150, ml=20, mr=20, pw=W-ml-mr;
  var lo=-70, hi=110;
  var x=function(v){ return ml+(v-lo)/(hi-lo)*pw; };
  var yc=70, bh=44;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="Reporting lag quantiles in days: minimum minus 65, 25th percentile 13, median 27, 75th percentile 47, 95th percentile 104.">';
  for(var t=-60;t<=100;t+=20){
    s+='<line x1="'+x(t)+'" x2="'+x(t)+'" y1="'+(yc-bh/2-10)+'" y2="'+(yc+bh/2+10)+'" stroke="'+C.grid+'"/>';
    s+='<text class="svg-num" x="'+x(t)+'" y="'+(yc+bh/2+26)+'" text-anchor="middle" fill="#5A6472">'+t+'</text>';
  }
  s+='<line x1="'+x(L.min)+'" x2="'+x(L.p95)+'" y1="'+yc+'" y2="'+yc+'" stroke="#12324B"/>';
  [["min",L.min],["p95",L.p95]].forEach(function(p){
    s+='<line x1="'+x(p[1])+'" x2="'+x(p[1])+'" y1="'+(yc-12)+'" y2="'+(yc+12)+'" stroke="#12324B"/>';
    s+='<text class="svg-num" x="'+x(p[1])+'" y="'+(yc-20)+'" text-anchor="middle" fill="#1A1D21">'+p[0]+' '+p[1]+'</text>';
  });
  s+='<rect x="'+x(L.p25)+'" y="'+(yc-bh/2)+'" width="'+(x(L.p75)-x(L.p25))+'" height="'+bh+'" fill="'+C.teal+'">'+
     '<title>Interquartile range: 25th percentile 13 days to 75th percentile 47 days</title></rect>';
  s+='<line x1="'+x(L.median)+'" x2="'+x(L.median)+'" y1="'+(yc-bh/2)+'" y2="'+(yc+bh/2)+'" stroke="#12324B" stroke-width="3"/>';
  s+='<text class="svg-num" x="'+x(L.p25)+'" y="'+(yc+bh/2+14)+'" text-anchor="middle" fill="#1A1D21">p25 '+L.p25+'</text>';
  s+='<text class="svg-num" x="'+x(L.median)+'" y="'+(yc-bh/2-6)+'" text-anchor="middle" fill="#12324B" font-weight="600">median '+L.median+'</text>';
  s+='<text class="svg-num" x="'+x(L.p75)+'" y="'+(yc+bh/2+14)+'" text-anchor="middle" fill="#1A1D21">p75 '+L.p75+'</text>';
  s+='<text class="svg-label" x="'+ml+'" y="'+(H-6)+'">days between visit and event record</text>';
  s+='</svg>';
  return card({
    cls:"c6", eyebrow:"Row 3 &middot; Timeliness",
    title:"Reporting lag distribution",
    sub:"Quantiles only &mdash; no synthetic density curve. n = "+N(L.n)+" encounters with a computable lag.",
    body:'<figure>'+s+'</figure>'+
      vat("p4box","Reporting lag quantiles",["Statistic","Days"],
        [["Minimum",N(L.min)],["25th percentile",N(L.p25)],["Median",N(L.median)],["75th percentile",N(L.p75)],
         ["95th percentile",N(L.p95)],["Mean (all rows)",(L.mean).toFixed(1)],
         ["Clean mean (0&ndash;180 days, n="+N(L.clean.n)+")",(L.clean.mean).toFixed(1)],
         ["Clean median",N(L.clean.median)]]),
    foot:"Max 14,393 days and 90 negative lags are corrupt and excluded from the clean series (n = "+N(L.clean.n)+", mean "+DY(L.clean.mean)+", median "+N(L.clean.median)+" days)."
  });
}

function scatter(){
  var F=DATA.byFacility, W=560,H=300, ml=54,mr=20,mt=18,mb=52;
  var pw=W-ml-mr, ph=H-mt-mb, xMax=3400, yMax=20;
  var X=function(v){ return ml+v/xMax*pw; }, Y=function(v){ return mt+ph-v/yMax*ph; };
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="Facility encounter volume against test positivity, 13 facilities. Dashed reference line at the programme average positivity of 9.1 percent. FAC-04 has 3,177 encounters at 16.2 percent positivity.">';
  for(var g=0;g<=yMax;g+=5){
    s+='<line x1="'+ml+'" x2="'+(ml+pw)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="'+C.grid+'"/>';
    s+='<text class="svg-num" x="'+(ml-8)+'" y="'+(Y(g)+4)+'" text-anchor="end" fill="#5A6472">'+g+'%</text>';
  }
  for(var xt=0;xt<=xMax;xt+=500){
    s+='<text class="svg-num" x="'+X(xt)+'" y="'+(mt+ph+18)+'" text-anchor="middle" fill="#5A6472">'+N(xt)+'</text>';
  }
  s+='<line x1="'+ml+'" x2="'+(ml+pw)+'" y1="'+Y(9.1)+'" y2="'+Y(9.1)+'" stroke="#12324B" stroke-dasharray="6 4"/>';
  s+='<text class="svg-num" x="'+(ml+pw)+'" y="'+(Y(9.1)-6)+'" text-anchor="end" fill="#12324B">programme average 9.1% (1,176 / 12,936)</text>';
  F.forEach(function(f){
    s+='<circle cx="'+X(f.n).toFixed(1)+'" cy="'+Y(f.tpr).toFixed(1)+'" r="5" fill="'+C.teal+'" fill-opacity="0.85" stroke="#FFFFFF">'+
       '<title>'+esc(f.name)+' — '+N(f.n)+' encounters, TPR '+P1(f.tpr)+' ('+N(f.p)+' / '+N(f.t)+')</title></circle>';
    if(f.tpr>12 || f.n>1500){
      s+='<text class="svg-num" x="'+(X(f.n)-8).toFixed(1)+'" y="'+(Y(f.tpr)-8).toFixed(1)+'" text-anchor="end" fill="#1A1D21">'+
         esc(f.name)+' '+P1(f.tpr)+'</text>';
    }
  });
  s+='<text class="svg-label" x="'+(ml+pw/2)+'" y="'+(H-10)+'" text-anchor="middle">Encounters</text>';
  s+='<text class="svg-label" x="'+ml+'" y="10">Test positivity %</text>';
  s+='</svg>';
  return card({
    cls:"c6", eyebrow:"Row 3b &middot; Burden vs effort",
    title:"Facility volume against positivity",
    sub:"13 facilities. Reference line is the observed programme average, never a target.",
    body:'<figure>'+s+'</figure>'+
      vat("p4scatter","Facility volume and positivity",["Facility","Encounters","Tested","Positives","TPR"],
        F.slice().sort(function(a,b){return b.n-a.n;}).map(function(f){
          return [esc(f.name),N(f.n),N(f.t),N(f.p),P1(f.tpr)]; })),
    foot:"No target line is drawn. The only defensible references in this artifact are observed programme means (TPR 9.1%, referral 44.0%, lag 34.7 days)."
  });
}

function renderP4(){
  var got=p4Rows();
  var isFac=p4.view==="facility";
  var chipTxt = isFac
    ? "Showing "+N(got.rows.length)+" of 13 facilities"
    : "Showing "+N(got.rows.length)+" of 183 CHWs with &ge;"+p4.minN+" encounters"+
      (got.below.length? " &middot; "+N(got.below.length)+" below threshold":"");
  var controls='<section class="card c12"><div class="controls">'+
    '<div class="seg" role="radiogroup" aria-label="Scorecard level">'+
      '<button type="button" role="radio" aria-checked="'+isFac+'" data-view="facility" tabindex="'+(isFac?0:-1)+'">Facility (13)</button>'+
      '<button type="button" role="radio" aria-checked="'+(!isFac)+'" data-view="chw" tabindex="'+(isFac?-1:0)+'">CHW (183)</button>'+
    '</div>'+
    '<label class="ctl">Search name <input type="text" id="p4q" value="'+esc(p4.q)+'" placeholder="type to filter"></label>'+
    (isFac?"":'<label class="ctl">Minimum encounters <input type="number" id="p4min" min="0" step="10" value="'+p4.minN+'" style="width:90px"></label>')+
    '<span class="live" role="status" aria-live="polite">'+chipTxt+'</span>'+
  '</div></section>';
  document.getElementById("panel-4").innerHTML=
    '<h1>Facility and CHW scorecard</h1>'+
    '<p class="page-sub">Ranked delivery performance &middot; every rate carries its denominator in the cell tooltip and the &ldquo;view as table&rdquo; disclosure</p>'+
    '<div class="grid">'+controls+'</div>'+
    '<div class="grid">'+scorecard()+'</div>'+
    '<div class="grid">'+boxStrip()+scatter()+'</div>';
  wireP4();
}
function wireP4(){
  var p=document.getElementById("panel-4");
  p.querySelectorAll("[data-view]").forEach(function(b){
    b.addEventListener("click", function(){
      p4.view=this.getAttribute("data-view"); p4.page=0; p4.showAll=false;
      p4.sortKey = p4.view==="facility" ? "n" : "score"; p4.sortDir=-1;
      renderP4();
      var el=document.querySelector('[data-view="'+p4.view+'"]'); if(el) el.focus();
    });
  });
  p.querySelectorAll("[data-sort]").forEach(function(b){
    b.addEventListener("click", function(){
      var k=this.getAttribute("data-sort");
      if(p4.sortKey===k) p4.sortDir=-p4.sortDir; else { p4.sortKey=k; p4.sortDir=(k==="name"?1:-1); }
      p4.page=0; renderP4();
      var el=document.querySelector('[data-sort="'+k+'"]'); if(el) el.focus();
    });
  });
  p.querySelectorAll("[data-page]").forEach(function(b){
    b.addEventListener("click", function(){
      var a=this.getAttribute("data-page");
      if(a==="prev") p4.page=Math.max(0,p4.page-1);
      else if(a==="next") p4.page=p4.page+1;
      else p4.showAll=true;
      renderP4();
    });
  });
  var q=document.getElementById("p4q");
  if(q) q.addEventListener("input", function(){
    p4.q=this.value.toLowerCase().trim(); p4.page=0; renderP4();
    var el=document.getElementById("p4q");
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  var mn=document.getElementById("p4min");
  if(mn) mn.addEventListener("change", function(){
    p4.minN=Math.max(0, parseInt(this.value,10)||0); p4.page=0; renderP4();
    var el=document.getElementById("p4min"); if(el) el.focus();
  });
}

/* ============================================================
   CROSS-PAGE FILTER (SC 3.3.7) + TABS
   ============================================================ */
var filterState={kind:null,value:null};
function saveFilter(){
  try{
    if(filterState.kind) sessionStorage.setItem("mdFilter", filterState.kind+":"+filterState.value);
    else sessionStorage.removeItem("mdFilter");
  }catch(e){}
  var h = filterState.kind ? "#"+encodeURIComponent(filterState.kind+":"+filterState.value) : "#";
  if(location.hash!==h){ try{ history.replaceState(null,"",h); }catch(e){} }
}
function setFilter(kind,value){
  if(filterState.kind===kind && filterState.value===value){ filterState={kind:null,value:null}; }
  else { filterState={kind:kind,value:value}; }
  saveFilter(); renderChips(); renderP2(); renderP4();
}
function renderChips(){
  var el=document.getElementById("chipbar");
  if(!filterState.kind){ el.innerHTML=""; return; }
  el.innerHTML='<span class="fchip">'+(filterState.kind==="tehsil"?"Tehsil":"Union council")+': '+
    esc(filterState.value)+'<button type="button" id="chipclear" aria-label="Remove filter '+esc(filterState.value)+'">&times;</button></span>'+
    '<span class="chipnote">Applies to the row-level tables (page 2 exception detail, page 4 CHW scorecard). '+
    'Aggregate cards remain programme-wide and are labelled as such.</span>';
  document.getElementById("chipclear").addEventListener("click", function(){
    filterState={kind:null,value:null}; saveFilter(); renderChips(); renderP2(); renderP4();
  });
}
function restoreFilter(){
  var raw="";
  try{ raw=sessionStorage.getItem("mdFilter")||""; }catch(e){}
  if(!raw && location.hash.length>1) raw=decodeURIComponent(location.hash.slice(1));
  var i=raw.indexOf(":");
  if(i>0){
    var k=raw.slice(0,i), v=raw.slice(i+1);
    if(k==="tehsil"||k==="uc") filterState={kind:k,value:v};
  }
}

var tabs=[].slice.call(document.querySelectorAll('[role="tab"]'));
function selectTab(i, focus){
  tabs.forEach(function(t,j){
    var on=i===j;
    t.setAttribute("aria-selected", on?"true":"false");
    t.tabIndex = on?0:-1;
    document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
  });
  if(focus) tabs[i].focus();
}
tabs.forEach(function(t,i){
  t.addEventListener("click", function(){ selectTab(i,false); });
  t.addEventListener("keydown", function(e){
    var k=e.key, n=null;
    if(k==="ArrowRight") n=(i+1)%tabs.length;
    else if(k==="ArrowLeft") n=(i-1+tabs.length)%tabs.length;
    else if(k==="Home") n=0;
    else if(k==="End") n=tabs.length-1;
    if(n!==null){ e.preventDefault(); selectTab(n,true); }
  });
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){
    var d=document.activeElement && document.activeElement.closest && document.activeElement.closest("details[open]");
    if(d){ d.open=false; d.querySelector("summary").focus(); }
  }
});

/* ---------- boot ---------- */
document.getElementById("hdrsub").innerHTML =
  esc(DATA.meta.period)+" &middot; "+N(TOT.encounters)+" encounters &middot; "+
  esc(DATA.meta.district)+" district, "+esc(DATA.meta.province)+" &middot; data as at "+esc(DATA.meta.generated);
restoreFilter();
renderChips();
renderP1();
renderP2();
renderP3();
renderP4();
})();
</script>
